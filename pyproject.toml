[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-rtl"
version = "0.6.0"
description = "A sphinx extension to build documentation for Hardware RTL, by an RTL engineer !"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
authors = [{ name = "Leonard HEYWANG" }]

dependencies = [
    "sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "gitpython>=3.1.62",
    "sphinx-design>=0.7.0",
    "cattrs>=26.2.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-vhdl>=2.0.3",
    "tree-sitter-verilog>=1.0.3",
    "tree-sitter-python>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "build", "twine"]
