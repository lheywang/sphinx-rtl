[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sphinx_rtl*"]

[project]
name = "sphinx-rtl"
version = "0.8.0"
description = "A sphinx extension to build documentation for Hardware RTL, by an RTL engineer !"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
authors = [{ name = "Leonard HEYWANG" }]

keywords = [
    "rtl",
    "sphinx",
    "systemverilog",
    "verilog",
    "vhdl",
    "cocotb",
    "asic",
    "fpga",
    "documentation",
]

classifiers = [

    # Development status
    "Development Status :: 4 - Beta",

    # Kind of project
    "Environment :: Plugins",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Documentation",

    # Python versions
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",

    # Targets
    "Intended Audience :: Developers",
    "Intended Audience :: Engineers",

    # License
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "gitpython>=3.1.62",
    "sphinx-design>=0.7.0",
    "sphinx-copybutton>=0.5.2",
    "cattrs>=26.2.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-vhdl>=2.0.3",
    "tree-sitter-verilog>=1.0.3",
    "tree-sitter-python>=0.25.0",
]

[project.urls]
PyPI = "https://pypi.org/project/sphinx-rtl/"
Repository = "https://github.com/lheywang/sphinx-rtl"
Demonstration = "https://example.com"
Issues = "https://github.com/lheywang/sphinx-rtl/issues"
Changelog = "https://github.com/lheywang/sphinx-rtl/blob/main/CHANGELOG.md"
Documentation = "https://github.com/lheywang/sphinx-rtl/blob/main/README.md"

[project.scripts]
sphinx-rtl = "sphinx_rtl.cli:cli"
