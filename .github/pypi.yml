name: Publish project to Pypi

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-publish:
    name: Build dist and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sphinx-rtl/
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installs
        run: python -m pip install --upgrade build

      - name: Build
        run: python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
