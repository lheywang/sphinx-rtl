name: Deploy Showcase

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - docs/**
      - examples/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.15

      - name: Setup Packages
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Sphinx
        run: |
          sphinx-build -W --keep-going -b html web/pages docs/_build/html

      - name: Upload
        uses: action/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
